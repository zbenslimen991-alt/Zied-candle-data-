name: update-candles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: okx-candle-data-update
  cancel-in-progress: false

jobs:
  update-candles:
    name: Refresh and publish OKX candles
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Zied main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify updater exists
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          git rev-parse --short HEAD
          if [[ ! -f "scripts/refresh_candles.py" ]]; then
            echo "::error::scripts/refresh_candles.py is missing from the checked-out commit."
            echo "Check that the file is committed on the main branch."
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi
          python -m py_compile scripts/refresh_candles.py
          echo "Candle updater found and Python syntax is valid."

      - name: Refresh OKX historical candles
        env:
          CANDLE_LIMIT: "10000"
          CANDLE_BAR: "1H"
          PYTHONUNBUFFERED: "1"
        run: python scripts/refresh_candles.py

      - name: Validate generated data
        shell: bash
        run: |
          set -euo pipefail
          test -s data/refresh_status.json
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("data/refresh_status.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "bar": status.get("bar"),
              "target_candles": status.get("target_candles"),
              "eligible_pairs": status.get("eligible_pairs"),
              "updated_pairs": status.get("updated_pairs"),
              "failed_pairs": len(status.get("failed_pairs", [])),
          }, indent=2))
          if not status.get("updated_pairs"):
              raise SystemExit("No candle pairs were updated.")
          PY

      - name: Publish candles to data repository
        env:
          APP_REPO: ${{ secrets.APP_REPO }}
          APP_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${APP_REPO:-}" ]]; then
            echo "::error::Repository secret APP_REPO is missing."
            exit 1
          fi
          if [[ -z "${APP_REPO_TOKEN:-}" ]]; then
            echo "::error::Repository secret APP_REPO_TOKEN is missing."
            exit 1
          fi

          git clone --depth 1 "https://x-access-token:${APP_REPO_TOKEN}@github.com/${APP_REPO}.git" candle-data-repo
          mkdir -p candle-data-repo/data
          cp -a data/. candle-data-repo/data/

          cd candle-data-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "No candle data changes to publish."
          else
            git commit -m "Update OKX historical candles"
            git push origin HEAD
          fi
