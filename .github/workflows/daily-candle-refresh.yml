name: update-candles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: okx-candle-data-update
  cancel-in-progress: false

jobs:
  update-candles:
    name: Refresh and publish OKX candles to Zied
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout candle data repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify updater exists
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/refresh_candles.py
          python -m py_compile scripts/refresh_candles.py
          echo "Candle updater found and Python syntax is valid."

      - name: Refresh OKX historical candles
        env:
          CANDLE_LIMIT: "10000"
          CANDLE_BAR: "1H"
          PYTHONUNBUFFERED: "1"
        run: python scripts/refresh_candles.py

      - name: Validate generated data
        shell: bash
        run: |
          set -euo pipefail
          test -s data/refresh_status.json
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("data/refresh_status.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "bar": status.get("bar"),
              "target_candles": status.get("target_candles"),
              "eligible_pairs": status.get("eligible_pairs"),
              "updated_pairs": status.get("updated_pairs"),
              "failed_pairs": len(status.get("failed_pairs", [])),
          }, indent=2))
          if not status.get("updated_pairs"):
              raise SystemExit("No candle pairs were updated.")
          PY

      - name: Publish candle data to Zied repository
        env:
          ZIED_REPO: "zbenslimen991-alt/Zied"
          ZIED_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ZIED_REPO_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret APP_REPO_TOKEN. Add a token with Contents: Read and write access to zbenslimen991-alt/Zied."
            exit 1
          fi

          git clone --depth 1 "https://x-access-token:${ZIED_REPO_TOKEN}@github.com/${ZIED_REPO}.git" zied-repo
          mkdir -p zied-repo/data
          cp -a data/. zied-repo/data/

          cd zied-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/

          if git diff --cached --quiet; then
            echo "No candle data changes to publish to Zied."
          else
            git commit -m "Update OKX historical candles"
            git push origin HEAD:main
          fi
