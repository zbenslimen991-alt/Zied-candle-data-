name: Weekly AI Champion Training

on:
  schedule:
    # Fit and evaluate one challenger every Sunday at 05:00 UTC.
    - cron: '0 5 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  weekly-ai-training:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: okx-quant-portfolio-state
      cancel-in-progress: false
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate historical candle source
        working-directory: app
        run: |
          set -euo pipefail
          test -d okx_quant
          test -d candle_history/1H
          count="$(find candle_history/1H -maxdepth 1 -type f -name '*.json' | wc -l)"
          echo "H1_CANDLE_FILES=$count"
          if [ "$count" -lt 1 ]; then
            echo "ERROR: no canonical H1 candle files; refusing to train a model."
            exit 1
          fi

      - name: Train challenger and preserve champion unless it wins
        working-directory: app
        env:
          ZIED_TRAIN_HISTORICAL_AI: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python okx_quant/weekly_learning.py 2>&1 | tee "${RUNNER_TEMP}/weekly-ai-training.log"

      - name: Upload AI training report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-ai-champion-${{ github.run_id }}
          path: ${{ runner.temp }}/weekly-ai-training.log
          if-no-files-found: warn
          retention-days: 30
