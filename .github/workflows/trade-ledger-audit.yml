name: Closed Trade Ledger Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "okx_quant/audit_trade_ledger.py"
      - "tests/test_trade_ledger_audit.py"
      - "scripts/validate_candles.py"
      - ".github/workflows/trade-ledger-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Zied-candle-data
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout private Zied data repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: zied-data

      - name: Compile audit, candle validator, and tests
        run: python -m py_compile okx_quant/audit_trade_ledger.py scripts/validate_candles.py tests/test_trade_ledger_audit.py

      - name: Run audit unit tests
        run: python -m unittest discover -s tests -p 'test_trade_ledger_audit.py' -v

      - name: Reconcile actual Zied portfolio and strategy stats
        continue-on-error: true
        run: |
          python okx_quant/audit_trade_ledger.py \
            --portfolio zied-data/portfolio_0001.json \
            --stats zied-data/strategy_stats_0001.json \
            --output trade_ledger_audit_report.json

      - name: Validate historical candle files
        if: always()
        run: python scripts/validate_candles.py zied-data/candle_history candle_validation_report.json

      - name: Final audit gate
        if: always()
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          failures = []
          ledger_path = Path("trade_ledger_audit_report.json")
          candle_path = Path("candle_validation_report.json")
          if not ledger_path.exists():
              failures.append("trade ledger report missing")
          else:
              ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
              if ledger.get("reasonReconciliation", {}).get("status") != "MATCH":
                  failures.append("TP/SL/Time Exit counts do not reconcile")
              if ledger.get("pnlReconciliation", {}).get("status") != "MATCH":
                  failures.append("net PnL does not reconcile or is incomplete")
              if ledger.get("qualityIssues"):
                  failures.append("trade ledger has quality issues")
              if ledger.get("perStrategyStatsMismatches"):
                  failures.append(f"{len(ledger['perStrategyStatsMismatches'])} strategy-stat mismatches")
          if not candle_path.exists():
              failures.append("candle validation report missing")
          else:
              candles = json.loads(candle_path.read_text(encoding="utf-8"))
              print(json.dumps({k: candles.get(k) for k in (
                  "filesChecked", "rowsChecked", "filesByTimeframe",
                  "missingTimeframes", "issueTotals", "status")}, ensure_ascii=False))
              if candles.get("status") != "PASS":
                  failures.append("historical candle validation did not pass")
          if failures:
              print("AUDIT FAILURES: " + "; ".join(failures))
              sys.exit(1)
          print("ALL AUDITS PASSED")
          PY

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closed-trade-ledger-audit
          path: |
            trade_ledger_audit_report.json
            candle_validation_report.json
          if-no-files-found: ignore
