name: Repair Historical 15m Candle Gaps

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/repair_candle_gaps.py"
      - ".github/workflows/repair-candle-gaps.yml"

permissions:
  contents: read

concurrency:
  group: zied-candle-gap-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Zied-candle-data
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout private Zied data repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.APP_REPO }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: zied-data

      - name: Repair missing 15m candles from OKX
        run: python scripts/repair_candle_gaps.py

      - name: Validate repaired candle history
        run: python scripts/validate_candles.py zied-data/candle_history candle_validation_report.json

      - name: Commit verified candle repairs to private Zied
        run: |
          git -C zied-data config user.name "github-actions[bot]"
          git -C zied-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git -C zied-data status --porcelain -- candle_history/15m)" ]; then
            echo "No candle files changed; nothing to commit."
            exit 0
          fi
          git -C zied-data add candle_history/15m
          git -C zied-data commit -m "Repair missing historical 15m OKX candles"
          git -C zied-data push origin HEAD

      - name: Upload candle validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-candle-validation
          path: candle_validation_report.json
          if-no-files-found: ignore
