name: Strategy Logic Regression and Losing Trade Autopsy

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
  push:
    paths:
      - ".github/workflows/strategy-autopsy.yml"
      - "data/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: strategy-autopsy
  cancel-in-progress: false

jobs:
  regression-and-autopsy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candle-data repository
        uses: actions/checkout@v4

      - name: Checkout private Zied source repository
        uses: actions/checkout@v4
        with:
          repository: zbenslimen991-alt/Zied
          ref: main
          token: ${{ secrets.ZIED_REPO_TOKEN }}
          path: zied-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: zied-source/requirements.txt

      - name: Install test dependencies
        working-directory: zied-source
        run: python -m pip install --upgrade pip pytest numpy pandas requests

      - name: Compile changed modules
        working-directory: zied-source
        run: |
          python -m py_compile okx_quant/config.py
          python -m py_compile okx_quant/analyze_coin.py
          python -m py_compile okx_quant/meta_decision.py
          python -m py_compile okx_quant/market_regime.py
          python -m py_compile okx_quant/backtest.py
          python -m py_compile okx_quant/paper_trading.py
          python -m py_compile okx_quant/telegram.py
          python -m py_compile okx_quant/reporting.py
          python -m py_compile okx_quant/scanner.py
          python -m py_compile okx_quant/strategy_engine.py
          python -m py_compile okx_quant/historical_ai.py
          python -m py_compile okx_quant/weekly_learning.py
          python -m py_compile okx_quant/audit_strategy_performance.py
          python -m py_compile okx_quant/audit_strategy_oos_performance.py

      - name: Run AI champion promotion tests
        working-directory: zied-source
        run: python -m pytest -q okx_quant/test_ai_model_promotion.py

      - name: Run strategy metrics and autopsy regression tests
        working-directory: zied-source
        run: python -m pytest -q test_strategy_logic_repairs.py

      - name: Audit strategy registry
        working-directory: zied-source
        run: python okx_quant/audit_strategy_registry.py

      - name: Generate realized strategy performance and losing-trade autopsy
        working-directory: zied-source
        run: python okx_quant/audit_strategy_performance.py

      - name: Upload strategy performance and autopsy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-performance-autopsy
          path: zied-source/strategy_performance_audit.json
          if-no-files-found: ignore
          retention-days: 30
