name: Google Sheets Portfolio Statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: google-sheets-portfolio-statistics
  cancel-in-progress: false

jobs:
  export-statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout statistics exporter
        uses: actions/checkout@v4

      - name: Read private Zied portfolio
        uses: actions/checkout@v4
        with:
          repository: zbenslimen991-alt/Zied
          ref: main
          token: ${{ secrets.ZIED_READ_TOKEN }}
          path: zied-source
          sparse-checkout: |
            portfolio_0001.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Update Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          cp zied-source/portfolio_0001.json portfolio_0001.json
          python scripts/export_portfolio_stats_to_sheets.py
